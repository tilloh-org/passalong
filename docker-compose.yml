services:
  passalong:
    image: ghcr.io/tilloh-org/passalong:latest
    build: .
    container_name: passalong
    restart: unless-stopped
    ports:
      - "${PASSALONG_PORT:-4242}:4242"
    volumes:
      - passalong-data:/data
    environment:
      NODE_ENV: production
      PORT: 4242
      ORIGIN: ${PASSALONG_ORIGIN:-http://localhost:4242}
      PASSALONG_DATABASE_PATH: /data/passalong.sqlite
      PASSALONG_MEDIA_ROOT: /data/media
      PASSALONG_BOOTSTRAP: ${PASSALONG_BOOTSTRAP:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4242"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  passalong-data:
