services:
  passalong:
    image: ghcr.io/tilloh-org/passalong:latest
    build: .
    container_name: passalong
    restart: unless-stopped
    ports:
      - "${PASSALONG_PORT:-3000}:3000"
    volumes:
      - passalong-data:/data
    environment:
      NODE_ENV: production
      PORT: 3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  passalong-data:
