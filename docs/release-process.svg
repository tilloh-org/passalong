<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" font-family="'JetBrains Mono','Cascadia Code',monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb7185"/>
    </marker>
  </defs>

  <rect width="1180" height="640" fill="#020617"/>
  <rect width="1180" height="640" fill="url(#grid)"/>
  <text x="40" y="46" fill="#e2e8f0" font-size="20" font-weight="700">passalong release process</text>
  <text x="40" y="68" fill="#64748b" font-size="10">develop integrates · main releases · merge methods preserve ancestry</text>

  <!-- flow arrows (behind boxes) -->
  <path d="M 250 130 L 330 130" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M 640 130 L 720 130" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowRose)" fill="none"/>
  <path d="M 820 165 Q 820 290 900 315" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowCyan)" fill="none"/>
  <path d="M 820 390 L 725 390" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowViolet)" fill="none"/>
  <path d="M 560 390 L 345 390" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowViolet)" fill="none"/>

  <!-- step 1: feature PR -->
  <g>
    <rect x="70" y="95" width="180" height="70" rx="6" fill="#0f172a"/>
    <rect x="70" y="95" width="180" height="70" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="160" y="124" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">feature / fix PRs</text>
    <text x="160" y="142" fill="#94a3b8" font-size="9" text-anchor="middle">Conventional Commits</text>
  </g>

  <!-- step 2: develop -->
  <g>
    <rect x="330" y="80" width="310" height="100" rx="6" fill="#0f172a"/>
    <rect x="330" y="80" width="310" height="100" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="485" y="108" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">develop</text>
    <text x="485" y="126" fill="#94a3b8" font-size="9" text-anchor="middle">squash merge · integration branch</text>
    <text x="485" y="142" fill="#94a3b8" font-size="9" text-anchor="middle">build · test · e2e · audit · docker-scan</text>
    <text x="485" y="162" fill="#94a3b8" font-size="9" text-anchor="middle">publishes develop-&lt;sha7&gt; image</text>
  </g>

  <!-- step 3: release candidate PR -->
  <g>
    <rect x="720" y="95" width="200" height="70" rx="6" fill="#0f172a"/>
    <rect x="720" y="95" width="200" height="70" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="820" y="124" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">release candidate PR</text>
    <text x="820" y="142" fill="#94a3b8" font-size="9" text-anchor="middle">develop → main</text>
  </g>

  <!-- step 4: release please -->
  <g>
    <rect x="820" y="320" width="200" height="70" rx="6" fill="#0f172a"/>
    <rect x="820" y="320" width="200" height="70" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="920" y="349" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">Release Please PR</text>
    <text x="920" y="367" fill="#94a3b8" font-size="9" text-anchor="middle">version bump + changelog</text>
  </g>

  <!-- step 5: tag + image -->
  <g>
    <rect x="560" y="355" width="160" height="70" rx="6" fill="#0f172a"/>
    <rect x="560" y="355" width="160" height="70" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="640" y="384" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">tag + release image</text>
    <text x="640" y="402" fill="#94a3b8" font-size="9" text-anchor="middle">GitHub Release · vX.Y.Z</text>
  </g>

  <!-- step 6: backmerge -->
  <g>
    <rect x="120" y="355" width="220" height="70" rx="6" fill="#0f172a"/>
    <rect x="120" y="355" width="220" height="70" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="230" y="384" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">backmerge PR</text>
    <text x="230" y="402" fill="#94a3b8" font-size="9" text-anchor="middle">main → develop</text>
  </g>

  <!-- loop arrow from backmerge to feature PRs -->
  <path d="M 150 350 L 150 165" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 4" marker-end="url(#arrow)" fill="none"/>
  <text x="96" y="270" fill="#64748b" font-size="9" text-anchor="middle">next slice</text>

  <!-- recovery boundary -->
  <rect x="50" y="310" width="1000" height="135" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8 4" opacity="0.45"/>
  <text x="1050" y="460" fill="#fbbf24" font-size="8" text-anchor="end">after release workflow</text>


  <!-- merge-method labels -->
  <text x="290" y="120" fill="#64748b" font-size="8" text-anchor="middle">squash</text>
  <text x="680" y="120" fill="#fb7185" font-size="8" text-anchor="middle">merge commit</text>
  <text x="868" y="250" fill="#64748b" font-size="8" text-anchor="middle">merge commit</text>
  <text x="772" y="378" fill="#64748b" font-size="8" text-anchor="middle">merge commit</text>
  <text x="452" y="378" fill="#64748b" font-size="8" text-anchor="middle">merge commit</text>

  <!-- invariant callouts -->
  <g>
    <rect x="70" y="500" width="340" height="100" rx="6" fill="rgba(136,19,55,0.25)" stroke="#fb7185" stroke-width="1.2"/>
    <text x="90" y="526" fill="#fb7185" font-size="10" font-weight="700">never squash</text>
    <text x="90" y="546" fill="#94a3b8" font-size="9">release candidate · release-please · backmerge</text>
    <text x="90" y="562" fill="#94a3b8" font-size="9">squash breaks main → develop ancestry</text>
    <text x="90" y="578" fill="#94a3b8" font-size="9">and causes repeated release conflicts</text>
  </g>
  <g>
    <rect x="440" y="500" width="340" height="100" rx="6" fill="rgba(120,53,15,0.25)" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="460" y="526" fill="#fbbf24" font-size="10" font-weight="700">ancestry check after each release</text>
    <text x="460" y="546" fill="#94a3b8" font-size="9">git merge-base --is-ancestor origin/main origin/develop</text>
    <text x="460" y="562" fill="#94a3b8" font-size="9">compare main...develop must report behind_by: 0</text>
    <text x="460" y="578" fill="#94a3b8" font-size="9">before promoting the next release candidate</text>
  </g>
  <g>
    <rect x="810" y="500" width="330" height="100" rx="6" fill="rgba(8,51,68,0.35)" stroke="#22d3ee" stroke-width="1.2"/>
    <text x="830" y="526" fill="#22d3ee" font-size="10" font-weight="700">release notes source</text>
    <text x="830" y="546" fill="#94a3b8" font-size="9">Develop → main merge keeps individual commits,</text>
    <text x="830" y="562" fill="#94a3b8" font-size="9">so Release Please generates the changelog from</text>
    <text x="830" y="578" fill="#94a3b8" font-size="9">their user-facing Conventional Commit subjects</text>
  </g>
</svg>